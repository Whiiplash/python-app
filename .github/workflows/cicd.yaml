name: cicd
 
on:
  push:
    branches: [main]
    paths:
      - src/**
      - requirements.txt
      - Dockerfile
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      commit_id: ${{ steps.meta.outputs.commit_id }}
    steps:
      - uses: actions/checkout@v4
 
      - id: meta
        shell: bash
        run: echo "commit_id=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
 
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - uses: docker/setup-buildx-action@v3
 
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: whiiplash/python-app:${{ steps.meta.outputs.commit_id }}
 
  cd:
    needs: ci
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
 
      - name: Update desired image tag
        env:
          COMMIT_ID: ${{ needs.ci.outputs.commit_id }}
        shell: bash
        run: sed -i -E "s/^([[:space:]]*tag:).*/\1 ${COMMIT_ID}/" charts/python-app/values.yaml
 
      - name: Commit desired state
        uses: EndBug/add-and-commit@v9
        with:
          message: "Deploy image ${{ needs.ci.outputs.commit_id }}"
 
      - name: Install Argo CD CLI without sudo
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -ksSL -o "$RUNNER_TEMP/bin/argocd" \
            https://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x "$RUNNER_TEMP/bin/argocd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
 
      - name: Sync application
        env:
          ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --username admin \
            --password "$ARGOCD_PASSWORD" \
            --insecure \
            --grpc-web
          argocd app sync python-app
          argocd app wait python-app --health --timeout 300

